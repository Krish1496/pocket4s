# Render.com blueprint. Push to GitHub, then on render.com:
#   New + -> Blueprint -> pick this repo. It reads this file automatically.
services:
  - type: web
    name: puppy-poker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
